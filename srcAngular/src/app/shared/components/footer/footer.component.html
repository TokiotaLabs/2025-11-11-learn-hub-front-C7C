<footer class="flex overflow-hidden flex-col items-center px-20 pt-24 pb-6 w-full bg-neutral-800 max-md:px-5 max-md:max-w-full">
  <div class="flex flex-col w-full max-w-[1176px] max-md:max-w-full">
    <h2 class="self-center text-xl font-semibold text-center text-white rotate-[2.4492937051703357e-16rad]">
      Subscribe to our newsletter
    </h2>
    <app-newsletter-form></app-newsletter-form>

    <!-- Footer content -->
    <div class="flex flex-wrap gap-5 justify-between mt-20 w-full text-white max-md:mt-10 max-md:max-w-full">
      <div class="flex gap-2 text-3xl font-bold whitespace-nowrap">
        <img
          loading="lazy"
          [src]="logoUrl"
          alt="LearnHub footer logo"
          class="object-contain shrink-0 w-12 rounded-md aspect-square"
        />
        <div class="basis-auto rotate-[2.4492937051703357e-16rad]">
          LearnHub
        </div>
      </div>
      <nav class="flex flex-wrap gap-10 my-auto text-lg leading-loose max-md:max-w-full">
        <a
          *ngFor="let item of navItems"
          href="#"
          class="rotate-[2.4492937051703357e-16rad] hover:text-indigo-300 transition-colors"
        >
          {{ item }}
        </a>
      </nav>
    </div>

    <!-- Footer bottom -->
    <div class="flex flex-wrap gap-5 justify-between items-center mt-6 w-full max-md:max-w-full">
      <button class="flex gap-10 self-stretch px-3 py-2 text-sm leading-loose whitespace-nowrap rounded-md border border-solid bg-black bg-opacity-0 border-neutral-300 text-zinc-200">
        <span>English</span>
        <img
          loading="lazy"
          src="https://cdn.builder.io/api/v1/image/assets/TEMP/db82afa873dff1c194e8ec1ebdcafbca4bf30542c9e6c6efaeef2c8d2c861768?placeholderIfAbsent=true&apiKey=43f93c4c444042188d8c548c6db7827a"
          alt=""
          class="object-contain shrink-0 my-auto w-4 aspect-square"
        />
      </button>
      <p class="self-stretch my-auto text-sm leading-loose text-center text-white rotate-[2.4492937051703357e-16rad]">
        © 2024 Brand, Inc. • Privacy • Terms • Sitemap
      </p>
      <div class="flex gap-6 self-stretch my-auto">
        <img
          *ngFor="let platform of socialPlatforms"
          loading="lazy"
          [src]="getSocialIconUrl(platform.index)"
          [alt]="platform.name + ' icon'"
          class="object-contain shrink-0 w-6 aspect-square"
        />
      </div>
    </div>
  </div>
</footer>
