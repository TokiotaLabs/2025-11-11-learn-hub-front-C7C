<div class="bg-white shadow-md overflow-hidden">
  <app-header></app-header>
  
  <!-- Search Section -->
  <div class="bg-white flex w-full px-20 py-14 flex-col items-center font-normal justify-center">
    <div class="flex w-[800px] max-w-full flex-col items-stretch">
      <h1 class="transform rotate-0 text-black text-2xl font-archivo self-center">
        Course Catalog
      </h1>
      <div class="mt-6">
        <input
          type="text"
          [(ngModel)]="searchFilter"
          (ngModelChange)="onSearchChange()"
          placeholder="Search courses..."
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>
    </div>
  </div>

  <!-- Courses List Section -->
  <div class="bg-white flex w-full px-20 py-14 flex-col items-center justify-center">
    <div class="flex w-full max-w-[1176px] flex-col items-stretch">
      <h2 class="transform rotate-0 text-black text-2xl font-archivo font-normal self-center">
        Available Courses
      </h2>
      <div class="mt-5 w-full grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div *ngFor="let course of filteredCourses" class="p-6 border border-gray-200 rounded-lg shadow-sm hover:shadow-md transition-shadow">
          <h3 class="text-xl font-bold text-gray-900 mb-2">{{ course.title }}</h3>
          <p class="text-gray-600 mb-4">{{ course.description }}</p>
          <div class="flex justify-between items-center">
            <span class="text-indigo-600 font-semibold">{{ course.price | currency }}</span>
            <a [routerLink]="['/courses/detail', course.id]" class="text-indigo-500 hover:text-indigo-700">
              View Details
            </a>
          </div>
        </div>
      </div>
      
      <div *ngIf="filteredCourses.length === 0" class="text-center py-10 text-gray-500">
        No courses found
      </div>
    </div>
  </div>

  <app-footer></app-footer>
</div>
